; Trunk SIP contra tu proveedor VoIP (donde desvías el número SIMYO)
; Sustituye SIP_SERVER, SIP_USER, SIP_PASS y TU_DID por los datos reales de tu proveedor.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- Registro contra el proveedor (si tu proveedor requiere registration) ---
[trunk-provider]
type=registration
outbound_auth=trunk-auth
server_uri=sip:SIP_SERVER
client_uri=sip:SIP_USER@SIP_SERVER
retry_interval=60

[trunk-auth]
type=auth
auth_type=userpass
username=SIP_USER
password=SIP_PASS

[trunk-aor]
type=aor
contact=sip:SIP_SERVER

[trunk-endpoint]
type=endpoint
context=from-voip
disallow=all
allow=alaw
allow=ulaw
outbound_auth=trunk-auth
aors=trunk-aor
from_user=SIP_USER

[trunk-identify]
type=identify
endpoint=trunk-endpoint
match=SIP_SERVER
