[from-voip]
; Llamadas entrantes por el trunk SIP (desvío de SIMYO -> proveedor VoIP -> aquí)
exten => _X.,1,NoOp(Llamada entrante Mr. Wolf desde ${CALLERID(num)})
 same => n,Answer()
 same => n,Stasis(mrwolf)
 same => n,Hangup()

[transfer]
; Usado por el orquestador para transferir a una persona real.
; Marca hacia tu móvil saliendo por el mismo trunk SIP del proveedor.
exten => s,1,NoOp(Transferencia a humano)
 same => n,Dial(PJSIP/${TRANSFER_TO}@trunk-endpoint,45)
 same => n,Hangup()

; --- Alternativa Bluetooth (chan_mobile), por si vuelves a usarla más adelante ---
[from-mobile]
exten => _X.,1,NoOp(Llamada entrante Mr. Wolf desde ${CALLERID(num)})
 same => n,Answer()
 same => n,Stasis(mrwolf)
 same => n,Hangup()
