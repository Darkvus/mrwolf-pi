[from-mobile]
; Todas las llamadas entrantes por el canal Mobile (Bluetooth/Android) entran aquí
exten => _X.,1,NoOp(Llamada entrante Mr. Wolf desde ${CALLERID(num)})
 same => n,Answer()
 same => n,Stasis(mrwolf)
 same => n,Hangup()

[transfer]
; Usado por el orquestador para transferir a una persona real
exten => s,1,NoOp(Transferencia a humano)
 same => n,Dial(Mobile/android-mrwolf/${TRANSFER_TO},45)
 same => n,Hangup()
